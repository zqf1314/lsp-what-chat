name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 新版 sdkmanager 已移除 "tools" 包，默认值会导致 Failed to find package 'tools'
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble release (debug-signed)
        run: gradle :module:assembleRelease --no-daemon --stacktrace

      - name: Show outputs
        run: |
          ls -lh module/build/outputs/apk/release/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whatchat-mcp-apk
          path: module/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30