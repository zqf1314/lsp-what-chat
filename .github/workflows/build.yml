name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 新版 sdkmanager 已移除 "tools" 包，默认值会导致 Failed to find package 'tools'
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/whatchat.keystore"
            printf 'keystore ready: '; ls -l "$RUNNER_TEMP/whatchat.keystore"
          else
            echo "no keystore secret, will fall back to debug signing"
          fi

      - name: Assemble release
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/whatchat.keystore
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_ALIAS: whatchat
        run: gradle :module:assembleRelease --no-daemon --stacktrace

      - name: Show outputs
        run: |
          ls -lh module/build/outputs/apk/release/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whatchat-mcp-apk
          path: module/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30